services:
  api:
    image: techstore-api:latest
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: file:./data/prod.db
      JWT_SECRET: techstore-jenkins-secret
      PORT: 4000
    volumes:
      - ./backend/public/images:/app/public/images
      - api_data:/app/prisma/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    image: techstore-web:latest
    build:
      context: .
      args:
        VITE_API_URL: http://127.0.0.1:4000/api
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  api_data:
